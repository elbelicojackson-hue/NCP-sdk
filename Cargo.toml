[package]
name = "ncp-sdk"
version = "0.1.0"
edition = "2021"
description = "Neural Consensus Protocol - Core algorithm SDK in Rust"
license = "SEE LICENSE IN ../LICENSE"
repository = "https://github.com/elbelicojackson-hue/ant-"
keywords = ["consensus", "multi-agent", "protocol", "entropy", "verification"]

[lib]
name = "ncp"
crate-type = ["lib", "cdylib"]  # cdylib for FFI (Python/Node bindings)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
thiserror = "1"

[dev-dependencies]
criterion = "0.5"
